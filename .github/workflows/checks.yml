name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Specs audit
        uses: justinmchase/specs@v1

      - uses: justinmchase/uffda/.github/actions/uffda-setup@0.10.9
        with:
          version: 0.10.9

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test
